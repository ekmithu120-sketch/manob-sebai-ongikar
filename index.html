<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login - মানব সেবাই অঙ্গীকার</title><style>body{margin:0;background:#f3f7fb;font-family:Arial,"Noto Sans Bengali",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}.box{background:#fff;padding:30px;border-radius:18px;box-shadow:0 8px 30px #0002;width:min(360px,86%);text-align:center}.box img{width:110px;height:110px;border-radius:50%;object-fit:cover}.box h2{color:#063b73}input{width:100%;padding:13px;margin:8px 0;border:1px solid #ccd7e0;border-radius:9px;box-sizing:border-box}button{width:100%;padding:13px;border:0;border-radius:9px;background:#0d6aa8;color:#fff;font-weight:700;margin-top:8px}.err{color:#c62828;min-height:20px;font-size:13px}</style></head><body><div class="box"><img src="logo.jpg"><h2>মানব সেবাই অঙ্গীকার</h2><p>লগইন করুন</p><input id="u" placeholder="Login ID"><input id="p" type="password" placeholder="Password"><div class="err" id="e"></div><button onclick="login()">লগইন</button></div><script>function login(){if(document.getElementById('u').value==='admin'&&document.getElementById('p').value==='123456'){sessionStorage.ok='1';location.href='home.html'}else document.getElementById('e').textContent='Login ID বা Password সঠিক নয়।'}</script></body></html>
